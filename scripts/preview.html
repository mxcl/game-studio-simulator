<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oxanium:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Oxanium", "Trebuchet MS", sans-serif;
        background: #020204;
        color: #f7f3ff;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 20px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      button {
        font-family: inherit;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        color: #f7f3ff;
        background: rgba(255, 255, 255, 0.08);
        padding: 9px 14px;
        cursor: pointer;
      }

      .status {
        opacity: 0.8;
        text-align: center;
        font-size: 12px;
      }

      canvas {
        width: min(96vw, 1536px);
        height: auto;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.65);
        display: block;
      }

      body.export-mode main {
        min-height: 0;
        display: block;
        padding: 0;
      }

      body.export-mode .controls,
      body.export-mode .status {
        display: none;
      }

      body.export-mode canvas {
        width: auto;
        border: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="preview" width="1" height="1"></canvas>
      <div class="controls">
        <button id="download" type="button">Download PNG</button>
      </div>
      <div class="status" id="status">Loading preview base image...</div>
    </main>

    <script>
      const EXPORT_MODE = new URLSearchParams(window.location.search).has(
        "export"
      );
      const SOURCE_IMAGE = "../assets/queen-ii.png";
      const OUTPUT_NAME = "preview.png";
      const TITLE_TEXT = "GAME STUDIO SIMULATOR";
      const BG_COLOR = "#020204";
      const IMAGE_OFFSET_RATIO = 0.1;
      const TEXT_PADDING_RATIO = 0.075;

      if (EXPORT_MODE) {
        document.body.classList.add("export-mode");
      }

      const canvas = document.getElementById("preview");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const downloadButton = document.getElementById("download");

      let baseImage;

      function setStatus(message) {
        if (statusEl) statusEl.textContent = message;
      }

      function fitFontSize(text, family, maxWidth, minSize, maxSize, weight) {
        for (let size = maxSize; size >= minSize; size -= 1) {
          ctx.font = `${weight} ${size}px ${family}`;
          if (ctx.measureText(text).width <= maxWidth) return size;
        }

        return minSize;
      }

      function drawTextLayer() {
        const width = canvas.width;
        const height = canvas.height;
        const horizontalPad = width * TEXT_PADDING_RATIO;
        const verticalPad = height * TEXT_PADDING_RATIO;

        const topFade = ctx.createLinearGradient(0, 0, 0, height * 0.2);
        topFade.addColorStop(0, "rgba(0, 0, 0, 0.42)");
        topFade.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = topFade;
        ctx.fillRect(0, 0, width, height * 0.2);

        const titleSize = fitFontSize(
          TITLE_TEXT,
          '"Bebas Neue", "Impact", sans-serif',
          width - horizontalPad * 2,
          92,
          190,
          400
        );

        const titleX = width / 2;
        const titleY = Math.round(verticalPad);

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = `400 ${titleSize}px "Bebas Neue", "Impact", sans-serif`;
        ctx.lineJoin = "round";
        ctx.lineWidth = Math.max(4, titleSize * 0.038);
        ctx.strokeStyle = "rgba(20, 26, 38, 0.95)";
        ctx.shadowColor = "rgba(106, 199, 255, 0.45)";
        ctx.shadowBlur = titleSize * 0.22;
        ctx.fillStyle = "#ffffff";
        ctx.strokeText(TITLE_TEXT, titleX, titleY);
        ctx.fillText(TITLE_TEXT, titleX, titleY);

        ctx.shadowColor = "rgba(255, 96, 196, 0.34)";
        ctx.shadowBlur = titleSize * 0.26;
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillText(TITLE_TEXT, titleX + 1.25, titleY - 1);
        ctx.restore();
      }

      function render() {
        if (!baseImage) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const width = canvas.width;
        const height = canvas.height;
        const imageOffsetY = Math.round(height * IMAGE_OFFSET_RATIO);
        const scale = Math.max(
          width / baseImage.width,
          height / baseImage.height
        );
        const drawWidth = Math.round(baseImage.width * scale);
        const drawHeight = Math.round(baseImage.height * scale);
        const drawX = Math.round((width - drawWidth) / 2);
        const drawY = Math.round((height - drawHeight) / 2 + imageOffsetY);
        ctx.fillStyle = BG_COLOR;
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(baseImage, drawX, drawY, drawWidth, drawHeight);
        drawTextLayer();
      }

      async function loadImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${url}`));
          img.src = url;
        });
      }

      async function loadFonts() {
        if (!document.fonts) return;

        await Promise.all([
          document.fonts.load('400 120px "Bebas Neue"'),
          document.fonts.load('500 44px "Oxanium"'),
          document.fonts.ready,
        ]);
      }

      function downloadPng() {
        render();
        const url = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = url;
        a.download = OUTPUT_NAME;
        a.click();
      }

      downloadButton.addEventListener("click", downloadPng);

      async function init() {
        try {
          await loadFonts();
          baseImage = await loadImage(SOURCE_IMAGE);
          canvas.width = baseImage.width;
          canvas.height = baseImage.height;
          if (EXPORT_MODE) {
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
          } else {
            canvas.style.width = "";
            canvas.style.height = "";
          }
          render();
          setStatus(
            EXPORT_MODE ? "Export mode ready" : "Ready. Click Download PNG."
          );
        } catch (error) {
          console.error(error);
          setStatus(error.message);
        }
      }

      init();
    </script>
  </body>
</html>
